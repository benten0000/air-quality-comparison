schema: '2.0'
stages:
  forecast_experiments:
    cmd: PYTHONPATH=src python -m 
      air_quality_imputer.pipeline.run_forecast_experiments --params 
      configs/pipeline/params.yaml
    deps:
    - path: configs/pipeline/params.yaml
      hash: md5
      md5: a015efab008b9f9680e19a951ba4aed5
      size: 5306
    - path: data/raw
      hash: md5
      md5: 2e63b05f91bd8adf716e3332c0d18150.dir
      size: 39174879
      nfiles: 22
    - path: src/air_quality_imputer/models
      hash: md5
      md5: a2d4ff255fea3c5ca0e97d2ce5211f49.dir
      size: 43542
      nfiles: 5
    - path: src/air_quality_imputer/pipeline/run_forecast_experiments.py
      hash: md5
      md5: 14d111193a92975aa7558b8e08d9f55d
      size: 617
    - path: src/air_quality_imputer/training/forecast_runner.py
      hash: md5
      md5: 0722e6b76082234747c5dff046dfd24d
      size: 70568
    params:
      configs/pipeline/params.yaml:
        data:
          data_dir: data/raw
          stations:
          - E403
          - E404
          - E405
          - E407
          - E408
          - E409
          - E410
          - E411
          - E412
          - E413
          - E414
          - E415
          - E417
          - E418
          - E420
          - E421
          - E423
          - E801
          - E802
          - E803
          - E804
          station_geo_path: configs/pipeline/stations_geo.json
          datetime_col: datetime
          features:
          - station
          - PM10
          - PM2.5
          - temperature
          - rain
          - pressure
          - precipitation
          - wind_speed
          - clouds
          - wind_direction
          target_features:
          - PM10
          - PM2.5
          - temperature
          - rain
          - pressure
          - precipitation
          - wind_speed
          - clouds
          - wind_direction
        experiment:
          common:
            history_length: 24
            forecast_horizon: 1
            step_size: 1
            models:
            - transformer
            - lstm
            - gru
            - hybrid_loclstm
          standard:
            run: false
            val_ratio: 0.1
            train_ratio: 0.7
            test_ratio: 0.2
          five_fold:
            run: true
            n_folds: 5
            missing_months: 6
        metrics:
          mape_eps: 1e-06
          mape_min_abs_target: 1.0
        models:
          transformer:
            type: transformer
            runtime:
              bias: true
              use_torch_compile: true
              amp_dtype: auto
              compile_mode: reduce-overhead
              compile_dynamic: false
              optimizer_lr: 0.0002
              optimizer_fused: true
              optimizer_weight_decay: 0.01
              scheduler_warmup_ratio: 0.08
              scheduler_warmup_start_factor: 0.3
              scheduler_min_lr: 1e-07
              grad_clip_norm: 1.0
              dataloader_num_workers: -1
              dataloader_prefetch_factor: 4
              dataloader_persistent_workers: true
              dataloader_pin_memory: true
            params:
              d_model: 128
              n_layer: 2
              n_head: 4
              d_ffn: 256
              d_k:
              d_v:
              dropout: 0.2
              norm_eps: 1e-06
          lstm:
            type: lstm
            runtime:
              bias: true
              use_torch_compile: false
              amp_dtype: auto
              compile_mode: reduce-overhead
              compile_dynamic: false
              optimizer_lr: 0.0001
              optimizer_fused: true
              optimizer_weight_decay: 0.02
              scheduler_warmup_ratio: 0.125
              scheduler_warmup_start_factor: 0.3
              scheduler_min_lr: 1e-07
              grad_clip_norm: 1.0
              dataloader_num_workers: -1
              dataloader_prefetch_factor: 4
              dataloader_persistent_workers: true
              dataloader_pin_memory: true
            params:
              hidden_size: 128
              num_layers: 2
              dropout: 0.25
          gru:
            type: gru
            runtime:
              bias: true
              use_torch_compile: false
              amp_dtype: auto
              compile_mode: reduce-overhead
              compile_dynamic: false
              optimizer_lr: 0.0001
              optimizer_fused: true
              optimizer_weight_decay: 0.02
              scheduler_warmup_ratio: 0.125
              scheduler_warmup_start_factor: 0.3
              scheduler_min_lr: 1e-07
              grad_clip_norm: 0.5
              dataloader_num_workers: -1
              dataloader_prefetch_factor: 4
              dataloader_persistent_workers: true
              dataloader_pin_memory: true
            params:
              hidden_size: 128
              num_layers: 2
              dropout: 0.25
          hybrid_loclstm:
            type: hybrid_loclstm
            runtime:
              bias: true
              use_torch_compile: false
              amp_dtype: auto
              compile_mode: reduce-overhead
              compile_dynamic: false
              optimizer_lr: 0.0001
              optimizer_fused: true
              optimizer_weight_decay: 0.02
              scheduler_warmup_ratio: 0.125
              scheduler_warmup_start_factor: 0.3
              scheduler_min_lr: 1e-07
              grad_clip_norm: 0.5
              dataloader_num_workers: -1
              dataloader_prefetch_factor: 4
              dataloader_persistent_workers: true
              dataloader_pin_memory: true
            params:
              hidden_size: 128
              num_layers: 2
              dropout: 0.25
              embed_dim: 16
              geo_dim: 2
              station_feature_index: 0
        output:
          save_models: false
        paths:
          reports_dir: reports/forecast_experiments
          models_dir: artifacts/models/forecast_experiments
          metrics_path: reports/metrics/forecast_metrics.json
        seed: 42
        tracking:
          enabled: true
          log_dataset_every_run: true
          log_per_station_torch_models: true
          experiment: air-quality-missing-data-imputation
          experiment_standard: comperosion-normal
          experiment_five_fold: comperosion-5fold
          dataset_name: air_quality
          repo_owner: PetelinekBenjamin
          repo_name: air-quality-comparison
          tracking_uri: 
            https://dagshub.com/PetelinekBenjamin/air-quality-comparison.mlflow
        training:
          device: auto
          epochs: 80
          batch_size: 4096
          early_stopping: true
          patience: 20
          min_delta: 0.0
          log_every: 5
    outs:
    - path: artifacts/models/forecast_experiments
      hash: md5
      md5: d751713988987e9331980363e24189ce.dir
      size: 0
      nfiles: 0
    - path: reports/forecast_experiments
      hash: md5
      md5: 0bb76c73c4feb38b54e3c662deb27e75.dir
      size: 215926
      nfiles: 4
    - path: reports/metrics/forecast_metrics.json
      hash: md5
      md5: 672e429e3cfb79929b9ae14ecc7f1a97
      size: 3421
